[project]
name = "igmcp"
version = "0.1.0"
description = "Read-only remote MCP server over the official Instagram Graph API"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mohammed Sadiq Firas"}]
keywords = ["mcp", "model-context-protocol", "instagram", "instagram-graph-api"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/mohomod779-arch/igmcp"
Issues = "https://github.com/mohomod779-arch/igmcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
